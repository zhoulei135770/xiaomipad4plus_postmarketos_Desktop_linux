# ALSA UCM for Xiaomi Mi Pad 4 / 4 Plus (clover, sdm660-internal)
#
# Two independent playback paths share the same front-end PCM (MultiMedia1):
#
#   * Speakers  -> primary MI2S (PRI_MI2S_RX) -> two TI TAS2557 smart amps
#   * Headphones-> internal MI2S (INT0_MI2S_RX) -> PM660L WCD analog codec
#
# The old file only knew about INT0, which is why PulseAudio muted the
# speakers after the TAS2557 amplifiers were moved to the primary MI2S.

SectionVerb {
	Value {
		TQ "HiFi"
	}
}

SectionDevice."Speaker" {
	Comment "Built-in Speakers (TAS2557)"

	EnableSequence [
		cset "name='INT0_MI2S_RX Audio Mixer MultiMedia1' 0"
		cset "name='PRI_MI2S_RX Audio Mixer MultiMedia1' 1"
		cset "name='Left Speaker Playback Volume' 15"
		cset "name='Right Speaker Playback Volume' 15"
	]

	DisableSequence [
		cset "name='PRI_MI2S_RX Audio Mixer MultiMedia1' 0"
	]

	ConflictingDevices [
		"Headphones"
	]

	Value {
		PlaybackPCM "hw:${CardId},0"
		PlaybackPriority 200
		PlaybackChannels 2
	}
}

SectionDevice."Headphones" {
	Comment "Headphones (3.5 mm jack)"

	EnableSequence [
		cset "name='PRI_MI2S_RX Audio Mixer MultiMedia1' 0"
		cset "name='INT0_MI2S_RX Audio Mixer MultiMedia1' 1"
		cset "name='Digital RX1 MIX1 INP1' RX1"
		cset "name='Digital RX2 MIX1 INP1' RX2"
		cset "name='HPHL' Switch"
		cset "name='HPHR' Switch"
	]

	DisableSequence [
		cset "name='Digital RX1 MIX1 INP1' ZERO"
		cset "name='Digital RX2 MIX1 INP1' ZERO"
		cset "name='HPHL' ZERO"
		cset "name='HPHR' ZERO"
		cset "name='INT0_MI2S_RX Audio Mixer MultiMedia1' 0"
	]

	ConflictingDevices [
		"Speaker"
	]

	Value {
		PlaybackPCM "hw:${CardId},0"
		PlaybackPriority 100
		JackControl "Headset Jack"
	}
}

# disabled: capture PCM hw:X4,1 returns EINVAL on this boot
	}
}

# disabled: capture PCM hw:X4,1 returns EINVAL on this boot
	}
}
