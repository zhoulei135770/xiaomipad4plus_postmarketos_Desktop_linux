# Adreno 512 (SDM660): preemption and PMU eviction on this downstream msm
# kernel produce ringbuffer timeouts ("adreno_idle: timeout to drain
# ringbuffer") and zero-length indirect buffers, which end in a CP opcode
# error and a GPU lockup / hard system freeze.
options msm enable_preemption=0
options msm enable_eviction=0
options msm disable_acd=Y
